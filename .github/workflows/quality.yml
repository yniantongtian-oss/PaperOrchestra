name: Repository quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check installer syntax
        run: bash -n setup.sh
      - name: Compile Python sources
        run: python -m compileall -q skills examples
      - name: Parse all JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path(".").rglob("*.json"))
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"Validated {len(paths)} JSON documents")
          PY
